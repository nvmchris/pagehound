[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pagehound"
version = "0.1.0"
description = "Async, polite web scraper with declarative YAML recipes, a Rich-powered CLI and JSON/CSV export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nvmchris" }]
requires-python = ">=3.11"
keywords = ["scraping", "crawler", "web-scraping", "asyncio", "cli", "httpx"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
pagehound = "pagehound.cli:app"

[project.urls]
Homepage = "https://github.com/nvmchris/pagehound"
Issues = "https://github.com/nvmchris/pagehound/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pagehound"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["pagehound", "conftest"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["pagehound"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["selectolax.*", "respx.*"]
ignore_missing_imports = true
